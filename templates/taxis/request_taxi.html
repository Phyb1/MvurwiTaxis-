{% extends "base.html" %}
{% block title %}Request a Taxi{% endblock %}
{% block content %}
<h1>Request Any Taxi</h1>
<p>We'll notify all online drivers. A driver pays a small fee to unlock your number, so expect a WhatsApp call shortly.</p>
<form class="stack" method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Send request</button>
</form>
{% endblock %}
