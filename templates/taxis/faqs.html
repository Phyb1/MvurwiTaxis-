{% extends "base.html" %}
{% block title %}FAQs{% endblock %}
{% block content %}
<h1>Frequently Asked Questions</h1>
<p>
    <a href="{% url 'taxis:faqs' %}">All</a> &middot;
    <a href="{% url 'taxis:faqs' %}?for=passenger">For passengers</a> &middot;
    <a href="{% url 'taxis:faqs' %}?for=driver">For drivers</a>
</p>
{% for faq in faqs %}
<div class="lead-card">
    <h3>{{ faq.question }}</h3>
    <p>{{ faq.answer }}</p>
</div>
{% empty %}
<p>No FAQs published yet.</p>
{% endfor %}
{% endblock %}
