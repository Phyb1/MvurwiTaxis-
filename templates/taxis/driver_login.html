{% extends "base.html" %}
{% block title %}Driver Login{% endblock %}
{% block content %}
<h1>Driver Login</h1>
<form class="stack" method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Log in</button>
</form>
<p><a href="{% url 'taxis:password_reset' %}">Forgot password?</a></p>
{% endblock %}
